<!-- Backdrop -->
<div class="fixed inset-0 z-40 bg-black/40 backdrop-blur-sm" (click)="closeDialog()"></div>

<!-- Dialog -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <!-- Modal -->
  <div class="w-full max-w-3xl overflow-hidden rounded-3xl bg-white shadow-2xl">
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-slate-200 px-6 py-5">
      <div>
        <h2 class="text-2xl font-bold text-slate-800"> {{ book() ? 'Edit' : 'Add' }} Book</h2>

        <p class="mt-1 text-sm text-slate-500"> {{ book() ? 'Edit' : 'Add' }} book information and authors</p>
      </div>

      <button
        type="button"
        (click)="closeDialog()"
        class="flex h-10 w-10 items-center justify-center rounded-xl text-slate-500 transition hover:bg-slate-100"
      >
        ✕
      </button>
    </div>

    <!-- Body -->
    <form [formGroup]="bookForm" (ngSubmit)="submit()" class="space-y-6 px-6 py-6">
      <!-- Title -->
      <div>
        <label class="mb-2 block text-sm font-medium text-slate-700"> Title </label>

        <input
          type="text"
          formControlName="title"
          placeholder="Enter book title"
          class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm outline-none transition focus:border-slate-400"
        />
      </div>

      <!-- Grid -->
      <div class="grid grid-cols-1 gap-5 md:grid-cols-2">
        <!-- Price -->
        <div>
          <label class="mb-2 block text-sm font-medium text-slate-700"> Price </label>

          <input
            type="number"
            formControlName="price"
            placeholder="0.00"
            class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm outline-none transition focus:border-slate-400"
          />
        </div>

        <!-- Category -->
        <div>
          <label class="mb-2 block text-sm font-medium text-slate-700" for="category_id"> Category </label>

          <select
            name="category_id"
            formControlName="category_id"
            class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none transition focus:border-slate-400"
          >
            <option [ngValue]="null">Select category</option>

            @for (category of categories(); track category.id) {
              <option [ngValue]="category.id">
                {{ category.name }}
              </option>
            }
          </select>
        </div>

        <!-- Publisher -->
        <div class="md:col-span-2">
          <label class="mb-2 block text-sm font-medium text-slate-700" for="publisher_id">
            Publisher
          </label>

          <select
            name="publisher_id"
            formControlName="publisher_id"
            class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none transition focus:border-slate-400"
          >
            <option [ngValue]="null">Select publisher</option>

            @for (publisher of publishers(); track publisher.id) {
              <option [ngValue]="publisher.id">
                {{ publisher.name }}
              </option>
            }
          </select>
        </div>

        <!-- Authors -->
        <div class="md:col-span-2">
          <label class="mb-2 block text-sm font-medium text-slate-700" for="author_ids">
            Authors
          </label>

          <select
            name="author_ids"
            formControlName="author_ids"
            class="min-h-[180px] w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none transition focus:border-slate-400"
            multiple
          >
            @for (author of authors(); track author.id) {
              <option [value]="author.id">
                {{ author.name }}
              </option>
            }
          </select>

          <p class="mt-2 text-xs text-slate-400">
            Hold Ctrl (Windows) or Cmd (Mac) to select multiple authors.
          </p>
        </div>
      </div>

      <!-- Footer -->
      <div
        class="flex flex-col-reverse gap-3 border-t border-slate-200 pt-5 sm:flex-row sm:justify-end"
      >
        <button
          type="button"
          (click)="closeDialog()"
          class="rounded-2xl border border-slate-200 px-5 py-3 text-sm font-medium text-slate-700 transition hover:bg-slate-100"
        >
          Cancel
        </button>

        <button
          type="submit"
          class="rounded-2xl bg-slate-900 px-5 py-3 text-sm font-medium text-white transition hover:bg-slate-800"
        >
          Save Changes
        </button>
      </div>
    </form>
  </div>
</div>
