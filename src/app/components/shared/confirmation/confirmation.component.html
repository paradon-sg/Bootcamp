<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
  <!-- Modal -->
  <div class="w-full max-w-md rounded-3xl bg-white shadow-2xl overflow-hidden">
    <!-- Header -->
    <div class="px-6 pt-6 text-center">
      <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-red-100">
        <span class="text-3xl">🗑️</span>
      </div>

      <h2 class="mt-4 text-2xl font-bold text-slate-800">{{ title() }}</h2>

      <p class="mt-2 text-sm leading-6 text-slate-500">
        {{ message() }}
      </p>
    </div>

    <!-- Footer -->
    <div class="flex gap-3 px-6 py-6">
      <button
        type="button"
        (click)="cancel()"
        class="flex-1 rounded-2xl border border-slate-200 px-5 py-3 text-sm font-medium text-slate-700 transition hover:bg-slate-100"
      >
        Cancel
      </button>

      <button
        type="button"
        (click)="confirm()"
        class="flex-1 rounded-2xl bg-red-500 px-5 py-3 text-sm font-medium text-white transition hover:bg-red-600"
      >
        Delete
      </button>
    </div>
  </div>
</div>
